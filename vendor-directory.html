<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Partners — Sand & Seas Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d2137;
    --ocean: #1a4a6e;
    --teal: #2a7ea4;
    --sand: #e8dcc8;
    --gold: #c9a84c;
    --gold-light: #e8cb7a;
    --cream: #f7f3ec;
    --white: #ffffff;
    --text: #1a2635;
    --text-muted: #4a5e72;
    --card-bg: #ffffff;
    --border: rgba(201,168,76,0.2);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    background: var(--navy);
    padding: 64px 40px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 120%, rgba(42,126,164,0.35) 0%, transparent 70%);
  }
  .hero-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
    position: relative;
  }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 5vw, 62px);
    font-weight: 300;
    color: var(--white);
    line-height: 1.1;
    position: relative;
    margin-bottom: 16px;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--gold-light);
  }
  .hero p {
    font-size: 15px;
    color: rgba(255,255,255,0.65);
    max-width: 520px;
    margin: 0 auto;
    font-weight: 300;
    letter-spacing: 0.01em;
    position: relative;
  }

  /* SEARCH + FILTER BAR */
  .controls {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(13,33,55,0.06);
  }
  .search-wrap {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    border: 1px solid rgba(13,33,55,0.15);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--teal); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 8px 18px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.02em;
  }
  .filter-btn:hover { border-color: var(--teal); color: var(--teal); }
  .filter-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .count-badge {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-size: 11px;
    font-weight: 500;
    border-radius: 100px;
    padding: 1px 7px;
    margin-left: 5px;
  }

  /* SECTION HEADERS */
  .section-header {
    padding: 40px 40px 8px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .section-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--navy);
    letter-spacing: -0.01em;
  }
  .section-header .rule {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--gold), transparent);
  }
  .section-header .section-count {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 16px 40px 40px;
  }

  /* CARD */
  .card {
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(13,33,55,0.07);
    transition: transform 0.22s, box-shadow 0.22s;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(13,33,55,0.12);
  }
  .card-image {
    height: 160px;
    overflow: hidden;
    position: relative;
    background: var(--navy);
  }
  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
  }
  .card:hover .card-image img {
    transform: scale(1.04);
  }
  .card-image .cat-pill {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(13,33,55,0.75);
    backdrop-filter: blur(6px);
    color: var(--gold-light);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
  }
  .card-image .img-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.05em;
    text-align: center;
    padding: 16px;
    background: var(--ocean);
  }
  .card-body {
    padding: 18px 20px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    font-weight: 300;
    flex: 1;
    margin-bottom: 16px;
  }
  .card-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--teal);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    transition: gap 0.18s, color 0.18s;
  }
  .card:hover .card-cta {
    color: var(--gold);
    gap: 10px;
  }
  .card-cta svg { flex-shrink: 0; }

  /* NO RESULTS */
  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .no-results p { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; }

  /* HIDDEN */
  .hidden { display: none !important; }

  /* FOOTER */
  .footer {
    background: var(--navy);
    color: rgba(255,255,255,0.45);
    text-align: center;
    padding: 24px 40px;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  .footer a { color: var(--gold); text-decoration: none; }

  @media(max-width: 600px) {
    .hero { padding: 48px 24px 40px; }
    .controls { padding: 16px 20px; }
    .grid { padding: 12px 20px 32px; gap: 14px; }
    .section-header { padding: 28px 20px 6px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

</div>

<div id="mainContent"></div>

const SECTION_ORDER = ['cruise','destination','tour','themed','other'];
const SECTION_LABELS = {cruise:'Cruise Lines', destination:'Destinations', tour:'Tours & Experiences', themed:'Themed Travel', other:'Special Features'};

let activeFilter = 'all';
let searchVal = '';

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function filterCards() {
  searchVal = document.getElementById('searchInput').value.toLowerCase();
  render();
}

function matchesFilter(v) {
  const catMatch = activeFilter === 'all' || v.cat === activeFilter;
  const searchMatch = !searchVal || v.name.toLowerCase().includes(searchVal) || v.desc.toLowerCase().includes(searchVal) || v.cat.toLowerCase().includes(searchVal);
  return catMatch && searchMatch;
}

function updateCounts() {
  const cats = ['all','cruise','destination','tour','themed','other'];
  cats.forEach(cat => {
    const count = cat === 'all'
      ? VENDORS.filter(v => !searchVal || v.name.toLowerCase().includes(searchVal) || v.desc.toLowerCase().includes(searchVal)).length
      : VENDORS.filter(v => v.cat === cat && (!searchVal || v.name.toLowerCase().includes(searchVal) || v.desc.toLowerCase().includes(searchVal))).length;
    const el = document.getElementById('cnt-' + cat);
    if (el) el.textContent = count;
  });
}

function cardHTML(v) {
  return `<a class="card" href="${v.url}" target="_blank" rel="noopener">
    <div class="card-image">
      <img src="${v.img}" alt="${v.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="img-fallback" style="display:none">${v.name}</div>
      <span class="cat-pill">${v.cat === 'other' ? 'Featured' : v.cat.charAt(0).toUpperCase() + v.cat.slice(1)}</span>
    </div>
    <div class="card-body">
      <div class="card-name">${v.name}</div>
      <div class="card-desc">${v.desc}</div>
      <span class="card-cta">
        Explore
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>
    </div>
  </a>`;
}

function render() {
  updateCounts();
  const content = document.getElementById('mainContent');
  let html = '';
  let totalShown = 0;

  if (activeFilter === 'all') {
    SECTION_ORDER.forEach(cat => {
      const items = VENDORS.filter(v => v.cat === cat && matchesFilter(v));
      if (!items.length) return;
      totalShown += items.length;
      html += `<div class="section-header"><h2>${SECTION_LABELS[cat]}</h2><div class="rule"></div><span class="section-count">${items.length} partners</span></div>`;
      html += `<div class="grid">${items.map(cardHTML).join('')}</div>`;
    });
  } else {
    const items = VENDORS.filter(v => matchesFilter(v));
    totalShown = items.length;
    if (items.length) {
      html += `<div class="section-header"><h2>${SECTION_LABELS[activeFilter] || 'Results'}</h2><div class="rule"></div><span class="section-count">${items.length} partners</span></div>`;
      html += `<div class="grid">${items.map(cardHTML).join('')}</div>`;
    }
  }

  if (!totalShown) {
    html = `<div class="grid"><div class="no-results"><p>No results found for "${searchVal}"</p></div></div>`;
  }

  content.innerHTML = html;
}

render();
</script>
